  <style>
/* PAC-MAN 2027* — styles */
:root {
  --bg: #07061a; --panel: rgba(18, 16, 44, 0.92); --panel2: rgba(255, 255, 255, 0.06); --line: rgba(255, 255, 255, 0.1);
  --ink: #f4f3ff; --muted: #a8a5cf; --yellow: #ffe14d; --cyan: #4ef2ff; --pink: #ff4fd8; --red: #ff3b5c; --green: #5dff9e; --violet: #9b7bff;
  --display: 'Orbitron', 'Rubik', system-ui, sans-serif;
  --text: 'Rubik', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; position: fixed; inset: 0; background: var(--bg); }
body { color: var(--ink); font-family: var(--text); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; touch-action: none; }
button, input, select { font-family: inherit; color: inherit; }
button { cursor: pointer; }
input { user-select: text; -webkit-user-select: text; }
:focus-visible { outline: 3px solid var(--cyan); outline-offset: 2px; }
.hidden { display: none !important; }

#app { position: fixed; inset: 0; overflow: hidden; }

/* ---------- buttons ---------- */
.btn {
  border: 0; border-radius: 14px; padding: 11px 18px; font: 700 15px var(--text); letter-spacing: 0.02em;
  background: var(--panel2); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); transition: transform 0.12s, box-shadow 0.15s, background 0.15s;
}
.btn:hover { transform: translateY(-1px); background: rgba(255, 255, 255, 0.1); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: 0.4; cursor: default; transform: none; }
.btn.play {
  font: 900 clamp(17px, 2.6vh, 22px) var(--display); letter-spacing: 0.12em; color: #1a1300; padding: clamp(10px, 1.8vh, 16px) clamp(34px, 6vw, 64px);
  background: linear-gradient(180deg, #fff27a, #ffd21a); border-radius: 999px; box-shadow: 0 0 0 2px rgba(255, 225, 77, 0.35), 0 0 28px rgba(255, 210, 26, 0.45), 0 6px 0 #b88c00;
}
.btn.play:hover { background: linear-gradient(180deg, #fff59a, #ffdb3a); }
.btn.cyan { background: linear-gradient(180deg, #7ff7ff, #23c8e0); color: #002229; box-shadow: 0 0 22px rgba(78, 242, 255, 0.35); }
.btn.ghost { background: transparent; }
.btn.small { padding: 7px 12px; font-size: 13px; border-radius: 10px; }
.icon-btn {
  position: relative; width: 42px; height: 42px; border-radius: 12px; border: 0; background: var(--panel2); box-shadow: inset 0 0 0 1px var(--line);
  font-size: 18px; display: grid; place-items: center; transition: transform 0.12s, background 0.15s; flex: none;
}
.icon-btn:hover { background: rgba(255, 255, 255, 0.12); transform: translateY(-1px); }
.icon-btn.small { width: 34px; height: 34px; font-size: 13px; }
.icon-btn .dot { position: absolute; top: 6px; right: 6px; width: 9px; height: 9px; border-radius: 50%; background: var(--red); box-shadow: 0 0 8px var(--red); }

/* ---------- stage ---------- */
#stage { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: max(6px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) max(6px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left)); }
#board-wrap { position: relative; flex: 1 1 auto; min-height: 0; width: 100%; display: grid; place-items: center; }
#cv { display: block; border-radius: 10px; }
.hud { width: 100%; max-width: var(--board-w, 560px); display: flex; align-items: center; gap: 10px; flex: none; }
#hud-top { height: 46px; }
#hud-bot { height: 40px; justify-content: space-between; }
.hbox { flex: 1; min-width: 0; line-height: 1.05; }
.hbox small { display: block; font: 700 10px var(--display); letter-spacing: 0.14em; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hbox b { display: block; font: 900 clamp(15px, 2.6vh, 21px) var(--display); color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hbox.mid { text-align: center; }
.hbox.mid b { color: var(--yellow); }
.hbox.right { text-align: right; }
.lives { display: flex; gap: 4px; min-width: 0; }
.lives img { width: 22px; height: 22px; }
.fruits { display: flex; gap: 2px; flex-direction: row-reverse; }
.fruits img { width: 24px; height: 24px; }
.powers { display: flex; gap: 6px; flex: 1; justify-content: center; min-width: 0; overflow: hidden; }
.pchip { display: flex; align-items: center; gap: 4px; padding: 2px 8px 2px 2px; border-radius: 99px; background: var(--panel2); font: 700 12px var(--display); white-space: nowrap; }
.pchip img { width: 22px; height: 22px; }
.rchip { display: flex; align-items: center; gap: 5px; padding: 3px 8px; border-radius: 99px; background: var(--panel2); font: 700 11px var(--display); white-space: nowrap; }
.rchip i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.rchip.me { box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.5); }
.combo { display: flex; align-items: center; gap: 6px; font: 900 14px var(--display); color: var(--yellow); }
.combo i { display: block; width: 54px; height: 6px; border-radius: 9px; background: var(--panel2); overflow: hidden; }
.combo em { display: block; height: 100%; background: linear-gradient(90deg, var(--yellow), var(--pink)); border-radius: 9px; }

.banner {
  position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); text-align: center; pointer-events: none; z-index: 5;
  padding: 12px 22px; border-radius: 16px; background: rgba(7, 6, 26, 0.82); box-shadow: 0 0 0 1px var(--line), 0 0 40px rgba(155, 123, 255, 0.35);
  animation: pop 0.35s cubic-bezier(0.3, 1.5, 0.5, 1); max-width: 92%;
}
.banner b { display: block; font: 900 clamp(18px, 3.4vh, 30px) var(--display); letter-spacing: 0.1em; color: var(--cyan); text-shadow: 0 0 18px rgba(78, 242, 255, 0.7); }
.banner span { display: block; margin-top: 4px; font: 500 clamp(12px, 1.8vh, 15px) var(--text); color: var(--ink); }
@keyframes pop { from { opacity: 0; transform: translate(-50%, -50%) scale(0.8); } }

.dpad { position: relative; width: 168px; height: 168px; flex: none; margin-top: 6px; touch-action: none; }
.dpad button { position: absolute; width: 58px; height: 58px; border-radius: 16px; border: 0; background: rgba(255, 255, 255, 0.08); box-shadow: inset 0 0 0 1px var(--line); color: var(--muted); font-size: 20px; }
.dpad button.on { background: rgba(255, 225, 77, 0.35); color: #fff; }
.dpad .up { left: 55px; top: 0; } .dpad .down { left: 55px; bottom: 0; } .dpad .left { left: 0; top: 55px; } .dpad .right { right: 0; top: 55px; }
.dpad.side { position: absolute; left: max(10px, env(safe-area-inset-left)); bottom: max(10px, env(safe-area-inset-bottom)); margin: 0; opacity: 0.85; }

/* ---------- menu ---------- */
.screen { position: absolute; inset: 0; z-index: 10; display: flex; flex-direction: column; overflow: hidden;
  background: radial-gradient(70% 55% at 50% 0%, rgba(155, 123, 255, 0.28), transparent 70%), radial-gradient(60% 50% at 50% 100%, rgba(78, 242, 255, 0.14), transparent 70%), rgba(7, 6, 26, 0.78);
  padding: max(10px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left)); }
.topbar { display: flex; align-items: center; gap: 8px; flex: none; }
.topbar .grow { flex: 1; }
.profile { display: flex; align-items: center; gap: 10px; padding: 5px 14px 5px 5px; border: 0; border-radius: 16px; background: var(--panel2); box-shadow: inset 0 0 0 1px var(--line); text-align: left; min-width: 0; }
.profile canvas { width: 36px; height: 36px; border-radius: 10px; background: rgba(0, 0, 0, 0.35); flex: none; }
.pinfo { min-width: 0; }
.pinfo b { display: block; font: 700 13px var(--display); letter-spacing: 0.06em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 150px; }
.pinfo small { display: block; font-size: 12px; color: var(--muted); white-space: nowrap; }
.xpbar { display: block; width: 110px; height: 4px; border-radius: 9px; background: rgba(255, 255, 255, 0.1); overflow: hidden; margin-top: 3px; }
.xpbar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--cyan), var(--pink)); border-radius: 9px; transition: width 0.6s; }
.coins { font: 900 14px var(--display); color: var(--yellow); padding: 8px 12px; border-radius: 99px; background: rgba(255, 225, 77, 0.1); box-shadow: inset 0 0 0 1px rgba(255, 225, 77, 0.25); white-space: nowrap; }

.menu-main { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(6px, 1.7vh, 16px); text-align: center; }
.logo { margin: 0; line-height: 0.92; font-family: var(--display); font-weight: 900; letter-spacing: 0.04em; }
.logo .l1 { display: block; font-size: clamp(34px, min(10.5vw, 10vh), 100px); color: var(--yellow); text-shadow: 0 0 22px rgba(255, 210, 26, 0.65), 0 4px 0 #b88c00; }
.logo .l2 { display: inline-block; font-size: clamp(26px, min(8vw, 7.4vh), 74px); background: linear-gradient(90deg, var(--cyan), var(--violet) 50%, var(--pink)); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 14px rgba(155, 123, 255, 0.6)); letter-spacing: 0.32em; margin-right: -0.32em; }
.logo sup { font-size: 0.45em; color: var(--pink); -webkit-text-fill-color: var(--pink); letter-spacing: 0; vertical-align: top; }
.tagline { margin: 0; color: var(--muted); font-size: clamp(13px, 1.9vh, 16px); }
.modes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; width: min(880px, 100%); }
.mode {
  border: 0; border-radius: 16px; padding: clamp(9px, 1.6vh, 14px) 10px; text-align: left; background: var(--panel); box-shadow: inset 0 0 0 1px var(--line);
  transition: transform 0.12s, box-shadow 0.15s; display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; align-items: center; min-width: 0;
}
.mode:hover { transform: translateY(-2px); }
.mode .ic { grid-row: span 2; font-size: clamp(22px, 3.4vh, 30px); }
.mode b { font: 900 clamp(13px, 2vh, 16px) var(--display); letter-spacing: 0.06em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mode small { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mode.sel { box-shadow: inset 0 0 0 2px var(--yellow), 0 0 26px rgba(255, 225, 77, 0.25); }
.mode .badge { grid-column: 1 / -1; justify-self: start; font: 700 10px var(--display); letter-spacing: 0.08em; padding: 2px 7px; border-radius: 99px; background: rgba(93, 255, 158, 0.15); color: var(--green); margin-top: 3px; }
.mode-desc { margin: 0; color: var(--ink); font-size: clamp(12px, 1.8vh, 14px); max-width: 640px; opacity: 0.85; min-height: 1.2em; }
.opts { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px 16px; min-height: 36px; }
.opt { display: flex; align-items: center; gap: 8px; font: 700 11px var(--display); letter-spacing: 0.08em; color: var(--muted); }
.seg { display: inline-flex; padding: 3px; gap: 3px; border-radius: 12px; background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); }
.seg button { border: 0; background: transparent; padding: 6px 11px; border-radius: 9px; font: 700 13px var(--text); color: var(--muted); }
.seg button.sel { background: rgba(255, 225, 77, 0.16); color: var(--yellow); box-shadow: inset 0 0 0 1px rgba(255, 225, 77, 0.4); }
.seg button:disabled { opacity: 0.35; cursor: default; }
.hint { margin: 0; font-size: 12px; color: var(--muted); }
.foot { flex: none; text-align: center; font-size: 10.5px; color: rgba(168, 165, 207, 0.7); margin-top: 4px; }

/* ---------- overlays ---------- */
.overlay { position: fixed; inset: 0; z-index: 30; display: flex; padding: 14px; background: rgba(4, 3, 15, 0.72); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); animation: fade 0.18s; }
#pause { z-index: 25; }
@keyframes fade { from { opacity: 0; } }
.sheet { position: relative; margin: auto; width: min(620px, 100%); max-height: 100%; overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y;
  background: linear-gradient(180deg, rgba(30, 26, 70, 0.98), rgba(14, 12, 36, 0.98)); border-radius: 22px; padding: 20px; box-shadow: 0 0 0 1px var(--line), 0 30px 80px rgba(0, 0, 0, 0.5); animation: rise 0.25s ease-out; }
.sheet.small { width: min(340px, 100%); text-align: center; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } }
.sheet h2 { margin: 0 0 12px; font: 900 22px var(--display); letter-spacing: 0.08em; }
.sheet h3 { margin: 16px 0 8px; font: 700 12px var(--display); letter-spacing: 0.14em; color: var(--muted); text-transform: uppercase; }
.sheet p, .sheet li { color: var(--muted); line-height: 1.5; font-size: 14px; }
.sheet .close { position: absolute; top: 12px; right: 12px; width: 36px; height: 36px; border-radius: 10px; border: 0; background: var(--panel2); font-size: 15px; z-index: 2; }
.col-btns { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
.row-btns { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 16px; }

.big-score { font: 900 clamp(38px, 7vh, 56px) var(--display); color: var(--yellow); text-shadow: 0 0 24px rgba(255, 210, 26, 0.55); text-align: center; line-height: 1.1; }
.res-title { text-align: center; font: 900 clamp(20px, 3.6vh, 28px) var(--display); letter-spacing: 0.12em; margin: 0; }
.res-sub { text-align: center; color: var(--muted); margin: 4px 0 0; font-size: 14px; }
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 14px 0; }
.kpi { background: var(--panel2); border-radius: 12px; padding: 9px 4px; text-align: center; }
.kpi b { display: block; font: 900 18px var(--display); font-variant-numeric: tabular-nums; }
.kpi span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.rewards { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.rewards span { padding: 6px 12px; border-radius: 99px; background: var(--panel2); font: 700 13px var(--text); }
.rewards span.gold { background: rgba(255, 225, 77, 0.14); color: var(--yellow); }
.rewards span.green { background: rgba(93, 255, 158, 0.12); color: var(--green); }
.lvl { display: flex; align-items: center; gap: 10px; background: var(--panel2); border-radius: 12px; padding: 9px 12px; margin-top: 10px; font: 700 13px var(--display); }
.lvl .xpbar { flex: 1; width: auto; height: 7px; margin: 0; }
.table { width: 100%; border-collapse: collapse; font-size: 14px; }
.table td, .table th { padding: 7px 6px; text-align: left; border-bottom: 1px solid var(--line); }
.table th { font: 700 10px var(--display); letter-spacing: 0.1em; color: var(--muted); }
.table td.num { text-align: right; font: 700 14px var(--display); font-variant-numeric: tabular-nums; }
.table tr.me td { color: var(--yellow); }
.table tr.cpu td { color: var(--muted); }
.swatch { display: inline-block; width: 12px; height: 12px; border-radius: 50%; vertical-align: -1px; margin-right: 6px; }

.tabs { display: flex; gap: 4px; padding: 4px; border-radius: 12px; background: var(--panel2); margin: 10px 0; }
.tabs button { flex: 1; border: 0; padding: 8px 4px; border-radius: 9px; background: transparent; font: 700 13px var(--text); color: var(--muted); }
.tabs button.sel { background: rgba(255, 225, 77, 0.16); color: var(--yellow); }
.garage-top { display: flex; gap: 14px; align-items: center; }
.garage-top canvas { width: 120px; height: 120px; border-radius: 18px; background: radial-gradient(circle, rgba(155, 123, 255, 0.25), rgba(0, 0, 0, 0.3)); flex: none; }
.items { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
.item { position: relative; border: 0; border-radius: 14px; padding: 10px 8px; background: var(--panel2); box-shadow: inset 0 0 0 1px var(--line); text-align: center; font: 700 13px var(--text); }
.item canvas { width: 54px; height: 54px; display: block; margin: 0 auto 4px; }
.item small { display: block; font-weight: 500; font-size: 11px; color: var(--muted); margin-top: 3px; }
.item small.price { color: var(--yellow); font-weight: 700; }
.item.eq { box-shadow: inset 0 0 0 2px var(--yellow); }
.item.eq::after { content: '✓'; position: absolute; top: 6px; right: 9px; color: var(--yellow); }
.item.locked { opacity: 0.6; }
.item.shake { animation: shake 0.3s; }
@keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

.mission { display: flex; align-items: center; gap: 12px; background: var(--panel2); border-radius: 14px; padding: 12px; margin-bottom: 8px; }
.mission .mtxt { flex: 1; min-width: 0; }
.mission b { display: block; font-size: 14px; }
.mission .bar { height: 6px; border-radius: 9px; background: rgba(255, 255, 255, 0.08); margin-top: 6px; overflow: hidden; }
.mission .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--green), var(--cyan)); }
.mission .rw { font: 900 13px var(--display); color: var(--yellow); white-space: nowrap; }
.mission.done { box-shadow: inset 0 0 0 1px rgba(93, 255, 158, 0.5); }
.ach-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.ach { display: flex; gap: 10px; align-items: center; background: var(--panel2); border-radius: 12px; padding: 9px; opacity: 0.45; filter: grayscale(1); }
.ach.got { opacity: 1; filter: none; box-shadow: inset 0 0 0 1px rgba(255, 225, 77, 0.3); }
.ach .i { font-size: 22px; }
.ach b { display: block; font-size: 13px; }
.ach small { display: block; font-size: 11px; color: var(--muted); line-height: 1.3; }
.set { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); font-weight: 700; font-size: 14px; }
.set:last-child { border-bottom: 0; }
.switch { width: 48px; height: 28px; border-radius: 99px; border: 0; background: rgba(255, 255, 255, 0.14); position: relative; flex: none; transition: background 0.2s; }
.switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform 0.2s; }
.switch.on { background: var(--green); }
.switch.on::after { transform: translateX(20px); }
.text-in { width: 100%; padding: 10px 12px; border-radius: 12px; border: 0; background: rgba(0, 0, 0, 0.3); box-shadow: inset 0 0 0 1px var(--line); font: 700 15px var(--display); letter-spacing: 0.06em; text-transform: uppercase; outline: 0; }
.text-in:focus { box-shadow: inset 0 0 0 2px var(--cyan); }
input[type=range] { accent-color: var(--yellow); width: 150px; }
.pu-list { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.pu { display: flex; align-items: center; gap: 8px; background: var(--panel2); border-radius: 12px; padding: 8px; }
.pu img { width: 30px; height: 30px; }
.pu b { display: block; font-size: 13px; color: var(--ink); }
.pu small { display: block; font-size: 11px; color: var(--muted); }
.gh { display: flex; gap: 10px; align-items: center; margin: 6px 0; }
.gh i { width: 14px; height: 14px; border-radius: 50%; flex: none; }

#toasts { position: fixed; top: max(12px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); z-index: 60; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; width: min(420px, 92%); }
.toast { padding: 10px 16px; border-radius: 14px; background: rgba(18, 16, 44, 0.96); box-shadow: 0 0 0 1px var(--line), 0 10px 30px rgba(0, 0, 0, 0.4); font: 700 14px var(--text); animation: rise 0.25s; text-align: center; }
.toast.gold { box-shadow: 0 0 0 1px rgba(255, 225, 77, 0.5), 0 0 24px rgba(255, 225, 77, 0.25); }

/* ---------- small and short screens ---------- */
@media (max-width: 700px) {
  .modes { grid-template-columns: repeat(2, 1fr); }
  .topbar { gap: 6px; }
  .icon-btn { width: 36px; height: 36px; font-size: 15px; border-radius: 10px; }
  .pinfo b { max-width: 90px; }
  .xpbar { width: 70px; }
  .coins { padding: 6px 9px; font-size: 12px; }
  .kpis { grid-template-columns: repeat(2, 1fr); }
  .ach-grid, .pu-list { grid-template-columns: 1fr; }
}

  .profile .pinfo small { display: none; }

          ctx.beginPath(); ctx.arc(x - 0.27, y - 0.2, 0.11, 0, TAU); ctx.arc(x + 0.27, y - 0.2, 0.11, 0, TAU); ctx.fill();

          ctx.fillStyle = 'rgba(160,230,255,0.35)';

      for (const s of [-1, 1]) {
        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.ellipse(x + s * 0.3 + dx * 0.6, y - 0.22 + dy * 0.6, 0.22, 0.28, 0, 0, TAU); ctx.fill();
        ctx.fillStyle = '#2233ff';

    },
    fruit(ctx, type, x, y, s) {

      const circle = (cx, cy, r, c) => { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU); ctx.fill(); };
      const leaf = (cx, cy, rot, c) => { ctx.save(); ctx.translate(cx, cy); ctx.rotate(rot); ctx.fillStyle = c || '#3ddc5a'; ctx.beginPath(); ctx.ellipse(0, 0, 0.22, 0.1, 0, 0, TAU); ctx.fill(); ctx.restore(); };

          circle(-0.3, 0.3, 0.3, '#ff2244'); circle(0.3, 0.35, 0.3, '#ff2244');
          circle(-0.38, 0.22, 0.07, '#ffffff'); circle(0.22, 0.27, 0.07, '#ffffff');
          break;
        case 'strawberry':
          ctx.fillStyle = '#ff2b4a';
          ctx.beginPath(); ctx.moveTo(-0.45, -0.2); ctx.quadraticCurveTo(0, -0.45, 0.45, -0.2); ctx.quadraticCurveTo(0.4, 0.3, 0, 0.6); ctx.quadraticCurveTo(-0.4, 0.3, -0.45, -0.2); ctx.fill();
          ctx.fillStyle = '#ffe9a8';
          for (const [px, py] of [[-0.2, 0], [0.15, -0.05], [0, 0.25], [-0.1, 0.4], [0.2, 0.2]]) ctx.fillRect(px, py, 0.06, 0.06);

        case 'orange':

          break;
        case 'apple':
          circle(-0.18, 0.1, 0.38, '#ff2b3a'); circle(0.18, 0.1, 0.38, '#ff2b3a');
          ctx.strokeStyle = '#7a4a1a'; ctx.lineWidth = 0.08; ctx.beginPath(); ctx.moveTo(0, -0.2); ctx.lineTo(0.05, -0.5); ctx.stroke();

        case 'bell':

          break;

    },
    power(ctx, type, x, y, s, t) {
      const def = PM.POWERUPS[type];
      s = s || 1;
      ctx.save();
      ctx.translate(x, y); ctx.scale(s, s);
      ctx.fillStyle = 'rgba(10,10,30,0.85)';

          break;
        case 'magnet':
          ctx.lineWidth = 0.14;

          break;
        case 'shield':
          ctx.beginPath(); ctx.moveTo(0, -0.36); ctx.lineTo(0.3, -0.22); ctx.quadraticCurveTo(0.28, 0.2, 0, 0.38); ctx.quadraticCurveTo(-0.28, 0.2, -0.3, -0.22); ctx.closePath(); ctx.fill();
          break;
        case 'shock':

  PM.Draw = Draw;

  /* ================= particles & floating text ================= */
  class FX {
    constructor() { this.parts = []; this.texts = []; this.rings = []; }
    clear() { this.parts.length = 0; this.texts.length = 0; this.rings.length = 0; }
    burst(x, y, color, n, speed, size, life) {
      for (let i = 0; i < n && this.parts.length < 900; i++) {
        const a = Math.random() * TAU, s = (0.3 + Math.random()) * (speed || 6);
        this.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: (life || 0.6) * (0.6 + Math.random() * 0.6), max: life || 0.6,
          color: typeof color === 'function' ? color() : color, size: (size || 0.14) * (0.6 + Math.random() * 0.8), shape: 'dot', drag: 3 });
      }
    }
    spawn(p) { if (this.parts.length < 900) this.parts.push(Object.assign({ vx: 0, vy: 0, drag: 2, shape: 'dot', size: 0.12, life: 0.5, max: 0.5 }, p)); }
    text(x, y, str, color, size, life) { this.texts.push({ x, y, str, color, size: size || 0.9, life: life || 1, max: life || 1 }); }
    ring(x, y, color, r, life) { this.rings.push({ x, y, color, r: r || 3, life: life || 0.5, max: life || 0.5 }); }
    update(dt) {
      for (const p of this.parts) { p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; const k = Math.exp(-p.drag * dt); p.vx *= k; p.vy *= k; if (p.grav) p.vy += p.grav * dt; }
      this.parts = this.parts.filter(p => p.life > 0);
      for (const t of this.texts) { t.life -= dt; t.y -= dt * 0.8; }
      this.texts = this.texts.filter(t => t.life > 0);
      for (const r of this.rings) r.life -= dt;
      this.rings = this.rings.filter(r => r.life > 0);
    }
    draw(ctx) {
      for (const p of this.parts) {
        const a = Math.max(0, p.life / p.max);
        ctx.globalAlpha = a;
        ctx.fillStyle = p.color;
        if (p.shape === 'square') ctx.fillRect(p.x - p.size, p.y - p.size, p.size * 2, p.size * 2);
        else if (p.shape === 'heart') {
          const s = p.size;
          ctx.beginPath(); ctx.moveTo(p.x, p.y + s); ctx.bezierCurveTo(p.x - s * 2, p.y - s * 0.4, p.x - s * 0.6, p.y - s * 1.6, p.x, p.y - s * 0.5);
          ctx.bezierCurveTo(p.x + s * 0.6, p.y - s * 1.6, p.x + s * 2, p.y - s * 0.4, p.x, p.y + s); ctx.fill();
        } else if (p.shape === 'star') {
          ctx.fillRect(p.x - p.size, p.y - p.size * 0.25, p.size * 2, p.size * 0.5);
          ctx.fillRect(p.x - p.size * 0.25, p.y - p.size, p.size * 0.5, p.size * 2);
        } else { ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (0.4 + 0.6 * a), 0, TAU); ctx.fill(); }
      }
      for (const r of this.rings) {
        const k = 1 - r.life / r.max;
        ctx.globalAlpha = 1 - k;
        ctx.strokeStyle = r.color; ctx.lineWidth = 0.15 * (1 - k) + 0.03;
        ctx.beginPath(); ctx.arc(r.x, r.y, 0.3 + r.r * k, 0, TAU); ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }
  }
  PM.FX = FX;

  /* ================= the renderer ================= */
  class Renderer {
    constructor(canvas) {
      this.cv = canvas;
      this.ctx = canvas.getContext('2d');
      this.T = 16; this.dpr = 1; this.S = 16;
      this.fx = new FX();
      this.mazeKey = '';
      this.time = 0;
      this.shake = 0;
      this.dark = null;
      this.stars = Array.from({ length: 90 }, () => ({ x: Math.random() * W, y: Math.random() * H, s: Math.random() * 0.08 + 0.02, p: Math.random() * TAU }));
      this.showTargets = false;
      this.reduced = false;
    }
    resize(w, h) {
      const T = Math.max(6, Math.min(w / W, h / H));
      this.T = T;
      this.dpr = Math.min(window.devicePixelRatio || 1, 2);
      this.S = T * this.dpr;
      this.cv.style.width = Math.round(W * T) + 'px';
      this.cv.style.height = Math.round(H * T) + 'px';
      this.cv.width = Math.round(W * this.S);
      this.cv.height = Math.round(H * this.S);
      this.mazeKey = '';
    }

    /* walls: marching squares on tile centres, inset so corridors read wider (arcade look) */
    wallGeometry(maze) {
      const L = 0.82, fills = [], segs = [];
      const val = (x, y) => maze.type[PM.U.clamp(y, 0, H - 1) * W + PM.U.clamp(x, 0, W - 1)] === PM.TILE.WALL ? 1 : 0;
      const lerp = (a, b, k) => [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k];
      for (let j = -1; j < H; j++) {
        for (let i = -1; i < W; i++) {
          const v = [val(i, j), val(i + 1, j), val(i + 1, j + 1), val(i, j + 1)];
          const sum = v[0] + v[1] + v[2] + v[3];
          if (!sum) continue;
          const c = [[i + 0.5, j + 0.5], [i + 1.5, j + 0.5], [i + 1.5, j + 1.5], [i + 0.5, j + 1.5]];
          const poly = [], edge = [];
          for (let k = 0; k < 4; k++) {
            const n = (k + 1) % 4;
            if (v[k]) poly.push(c[k]);
            if (v[k] !== v[n]) { const p = v[k] ? lerp(c[n], c[k], L) : lerp(c[k], c[n], L); poly.push(p); edge.push(p); }
          }
          fills.push(poly);
          if (edge.length === 2) segs.push(edge);
          else if (edge.length === 4) {
            // saddle: keep the two wall corners connected
            if (v[0]) { segs.push([edge[0], edge[1]]); segs.push([edge[2], edge[3]]); }
            else { segs.push([edge[3], edge[0]]); segs.push([edge[1], edge[2]]); }
          }
        }
      }
      return { fills, segs };
    }
    buildMaze(game) {
      const th = PM.THEMES[game.theme] || PM.THEMES.retro;
      const key = game.maze.kind + game.maze.seed + game.theme + this.S;
      if (key === this.mazeKey) return;
      this.mazeKey = key;
      const geo = this.wallGeometry(game.maze);
      const make = (line, glowCol, fill) => {
        const c = document.createElement('canvas');
        c.width = this.cv.width; c.height = this.cv.height;
        const g = c.getContext('2d');
        g.scale(this.S, this.S);
        g.fillStyle = fill; g.strokeStyle = fill; g.lineWidth = 0.04;
        g.beginPath();
        for (const p of geo.fills) { g.moveTo(p[0][0], p[0][1]); for (let k = 1; k < p.length; k++) g.lineTo(p[k][0], p[k][1]); g.closePath(); }
        g.fill(); g.stroke();
        g.lineCap = 'round'; g.lineJoin = 'round';
        const path = new Path2D();
        for (const s of geo.segs) { path.moveTo(s[0][0], s[0][1]); path.lineTo(s[1][0], s[1][1]); }
        g.shadowColor = glowCol; g.shadowBlur = this.S * 0.55;
        g.strokeStyle = line; g.lineWidth = 0.16; g.stroke(path);
        g.shadowBlur = 0;
        g.globalAlpha = 0.65; g.strokeStyle = '#ffffff'; g.lineWidth = 0.045; g.stroke(path);
        g.globalAlpha = 1;
        // ghost house door
        g.fillStyle = th.door; g.fillRect(13, 12.4, 2, 0.2);
        return c;
      };
      this.mazeImg = make(th.wall, th.glow, th.fill);
      this.mazeFlash = make('#ffffff', '#ffffff', 'rgba(255,255,255,0.12)');
    }

    text(str, x, y, size, color, align) {
      const ctx = this.ctx;
      ctx.save();
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.font = '800 ' + Math.round(size * this.S) + 'px ' + FONT;
      ctx.textAlign = align || 'center'; ctx.textBaseline = 'middle';
      ctx.lineWidth = Math.max(2, this.S * 0.18); ctx.strokeStyle = 'rgba(0,0,0,0.75)'; ctx.lineJoin = 'round';
      ctx.strokeText(str, x * this.S + this.ox, y * this.S + this.oy);
      ctx.fillStyle = color;
      ctx.fillText(str, x * this.S + this.ox, y * this.S + this.oy);
      ctx.restore();
    }

    // effects that follow game events
    onEvent(e, game) {
      const fx = this.fx, P = game.pacs[e.pac] || game.player;
      const col = P ? Draw.pacColor(P.color, this.time) : '#ffe14d';
      switch (e.type) {
        case 'dot':
          if (e.kind === 2) { fx.ring(e.x, e.y, '#ffffff', 2.5, 0.45); fx.burst(e.x, e.y, '#ffffff', 14, 6, 0.12, 0.5); }
          else if (!this.reduced && Math.random() < (e.magnet ? 1 : 0.35)) fx.burst(e.x, e.y, (PM.THEMES[game.theme] || PM.THEMES.retro).dot, e.magnet ? 3 : 2, 2.5, 0.07, 0.3);
          break;
        case 'ghostEaten':
          fx.burst(e.x, e.y, PM.GHOSTS[e.ghost].color, 26, 8, 0.16, 0.7);
          fx.ring(e.x, e.y, '#4ef2ff', 3, 0.5);
          if (game.battle || e.shatter) fx.text(e.x, e.y - 0.6, String(e.pts), '#4ef2ff', 0.9, 1);
          this.shake = Math.max(this.shake, 0.18);
          break;
        case 'fruitEaten': fx.text(e.x, e.y, String(e.pts), '#ffb8ff', 0.85, 1.4); fx.burst(e.x, e.y, '#ff5ec8', 18, 5); break;
        case 'coin': fx.text(e.x, e.y - 0.5, '+100', '#ffcf3a', 0.7, 0.8); fx.burst(e.x, e.y, '#ffcf3a', 10, 4); break;
        case 'power': {
          const c = PM.POWERUPS[e.what].color;
          fx.ring(e.x, e.y, c, e.what === 'shock' ? 7 : 3, e.what === 'shock' ? 0.7 : 0.5);
          fx.burst(e.x, e.y, c, 24, 7, 0.14, 0.6);
          fx.text(e.x, e.y - 0.8, PM.POWERUPS[e.what].name.toUpperCase(), c, 0.7, 1.1);
          if (e.what === 'shock') this.shake = Math.max(this.shake, 0.35);
          break;
        }
        case 'shieldBlock': fx.ring(e.x, e.y, '#5dff9e', 3, 0.6); fx.burst(e.x, e.y, '#5dff9e', 20, 7); this.shake = Math.max(this.shake, 0.25); break;
        case 'death':
          this.shake = Math.max(this.shake, game.battle ? 0.25 : 0.4);
          if (game.battle) { fx.burst(e.x, e.y, col, 30, 8, 0.16, 0.8); }
          break;
        case 'rivalEaten': fx.text(e.x, e.y - 0.6, String(e.pts), '#ffe14d', 0.9, 1.2); fx.ring(e.x, e.y, '#ffe14d', 3, 0.5); break;
        case 'combo': fx.text(e.x, e.y - 1, 'COMBO x' + e.mult, '#ffd23a', 0.75, 1); break;
        case 'respawn': fx.ring(e.x, e.y, col, 2.5, 0.5); break;
        case 'levelClear': if (e.bonus) fx.text(14, 17.5, 'TIME BONUS ' + e.bonus, '#ffd23a', 0.8, 2.2); break;
        case 'extraLife': fx.text(P.x, P.y - 1, '1UP', '#5dff9e', 0.9, 1.4); break;
      }
    }

    trail(p, game, dt) {
      if (!p.alive || !p.moving || p.trail === 'none' || this.reduced) return;
      p._trailT = (p._trailT || 0) - dt;
      if (p._trailT > 0) return;
      p._trailT = 0.035;
      const bx = p.x - PM.DX[p.dir] * 0.6, by = p.y - PM.DY[p.dir] * 0.6;
      const j = () => (Math.random() - 0.5) * 0.5;
      switch (p.trail) {
        case 'sparkle': this.fx.spawn({ x: bx + j(), y: by + j(), color: Math.random() < 0.5 ? '#ffffff' : '#fff3a0', shape: 'star', size: 0.13, life: 0.45, max: 0.45 }); break;
        case 'hearts': this.fx.spawn({ x: bx + j(), y: by + j(), vy: -0.8, color: '#ff5ec8', shape: 'heart', size: 0.12, life: 0.6, max: 0.6 }); break;
        case 'fire': this.fx.spawn({ x: bx + j(), y: by + j(), vy: -1.6, color: Math.random() < 0.5 ? '#ff7a1a' : '#ffd23a', size: 0.2, life: 0.4, max: 0.4 }); break;
        case 'pixels': this.fx.spawn({ x: bx + j(), y: by + j(), color: Draw.pacColor(p.color, this.time), shape: 'square', size: 0.09, life: 0.5, max: 0.5 }); break;
        case 'rainbow': this.fx.spawn({ x: bx + j() * 0.4, y: by + j() * 0.4, color: rainbow(this.time * 2), size: 0.22, life: 0.5, max: 0.5 }); break;
      }
    }

    draw(game, dt, opt) {
      opt = opt || {};
      this.time += dt;
      const ctx = this.ctx, S = this.S, th = PM.THEMES[game.theme] || PM.THEMES.retro, t = this.time;
      this.buildMaze(game);
      this.fx.update(dt);
      for (const p of game.pacs) this.trail(p, game, dt);
      this.shake = Math.max(0, this.shake - dt);
      const sh = this.reduced ? 0 : this.shake;
      this.ox = sh ? (Math.random() - 0.5) * sh * S : 0;
      this.oy = sh ? (Math.random() - 0.5) * sh * S : 0;

      ctx.setTransform(1, 0, 0, 1, 0, 0);
      const bg = ctx.createLinearGradient(0, 0, 0, this.cv.height);
      bg.addColorStop(0, th.bg[0]); bg.addColorStop(1, th.bg[1]);
      ctx.fillStyle = bg; ctx.fillRect(0, 0, this.cv.width, this.cv.height);

        const icon = this.r.icon('pac', this.equipColor(), 44);
        this.set('h-lives', Array.from({ length: Math.min(g.lives, 6) }, () => `<img src="${icon}" alt="">`).join(''));
        const fr = [];
        for (let l = Math.max(1, g.level - 6); l <= g.level; l++) fr.push(PM.fruitFor(l).id);
        this.set('h-fruits', fr.map(f => `<img src="${this.r.icon('fruit', f, 48)}" alt="">`).join(''));
      }
      const pw = [];
      const add = (type, t) => { if (t > 0) pw.push(`<span class="pchip"><img src="${this.r.icon('power', type, 44)}" alt="">${Math.ceil(t)}</span>`); };
      add('turbo', me.turbo); add('magnet', me.magnet); add('shield', me.shield); add('phase', me.phase); add('double', me.dbl); add('freeze', g.freezeT);
      if (g.battle && me.power > 0) pw.unshift(`<span class="pchip" style="color:#fff">⚡ POWER ${Math.ceil(me.power)}</span>`);
      this.set('h-powers', pw.join(''));
      const showCombo = g.features && me.combo >= 10;
      if (this.hud.comboOn !== showCombo) { this.hud.comboOn = showCombo; $('h-combo').classList.toggle('hidden', !showCombo); }
      if (showCombo) {
        this.set('h-combo-x', 'x' + (1 + Math.min(3, Math.floor(me.combo / 20))) + ' <small style="font-size:10px;opacity:.7">' + me.combo + '</small>');
        $('h-combo-bar').style.width = (me.combo >= 60 ? 100 : (me.combo % 20) * 5) + '%';
      }
    },
    updateAmbient() {
      const g = this.game;
      let kind = null, prog = 0;
      if (!this.paused && g.state === 'play') {
        const eyes = g.ghosts.some(x => x.state === 'eaten' || x.state === 'entering');
        const fr = g.ghosts.some(x => x.fright > 0 && x.state !== 'house');
        kind = eyes ? 'eyes' : fr ? 'fright' : 'siren';
        prog = 1 - g.dotsLeft / Math.max(1, g.dotsTotal);
      }
      const key = kind + Math.round(prog * 20);
      if (key !== this.ambKey) { this.ambKey = key; PM.Audio.setAmbient(kind, prog); }
    },

    /* ---------------- results & rewards ---------------- */
    ensureMissions() {
      const today = PM.dateKey(), m = this.p.missions;
      if (m.date === today && m.list.length) return;
      const r = PM.rng(PM.hash('pm2027-missions-' + today));
      const pick = PM.shuffle(PM.MISSIONS.slice(), r).slice(0, 3);
      m.date = today;
      m.list = pick.map(d => ({ id: d.id, n: d.n[r.int(d.n.length)], reward: d.reward, progress: 0, done: false }));
      this.save();
    },
    missionText(m) { const d = PM.MISSIONS.find(x => x.id === m.id); return d.text.replace('{n}', fmt(m.n)); },

    finish() {
      if (this.ended || !this.game) return;
      this.ended = true;
      PM.Audio.setAmbient(null);
      const g = this.game, me = g.player, p = this.p, st = p.stats, s = me.stats, today = PM.dateKey();
      const score = me.score;
      const rank = g.pacs.slice().sort((a, b) => b.score - a.score);
      const place = rank.indexOf(me) + 1, win = g.battle && place === 1;
      // lifetime stats
      st.games++; st.dots += s.dots; st.ghosts += s.ghosts; st.fruits += s.fruits; st.levels += this.levelsCleared;
      st.deaths += s.deaths; st.powerups += s.powerups; st.bestLevel = Math.max(st.bestLevel, g.level);
      st.bestCombo = Math.max(st.bestCombo, me.bestCombo); st.perfectLevels += this.perfectLevels; st.time += Math.round(g.time);
      if (g.battle) { st.battles++; if (win) st.battleWins++; }
      // rewards
      let xp = Math.round(score / 100) + this.levelsCleared * 25 + (win ? 120 : 0) + (g.battle ? (4 - place) * 15 : 0);
      let coins = Math.floor(score / 400) + me.coins + (win ? 40 : g.battle && place === 2 ? 15 : 0);
      if (this.practice) { xp = Math.round(xp / 4); coins = Math.floor(coins / 4); }
      // daily
      if (g.mode === 'daily' && !this.practice) {
        const d = p.daily;
        d.streak = d.last === yesterday() ? d.streak + 1 : d.last === today ? d.streak : 1;
        d.last = today;
        d.history[today] = { score, level: g.level };
      }
      // high score table
      let tablePos = 0, best = false;
      if (!this.practice) {
        const list = p.scores[g.mode];
        const prevBest = list.length ? list[0].score : 0;
        list.push({ name: p.name || 'PLAYER', score, level: g.level, date: today });
        list.sort((a, b) => b.score - a.score);
        list.length = Math.min(list.length, 10);
        best = score > prevBest && score > 0;
        const all = list.map(x => x.score).concat(PM.CPU_SCORES[g.mode].map(c => c[1])).sort((a, b) => b - a);
        tablePos = all.indexOf(score) + 1;
      }
      // missions
      const ms = p.missions, finished = [];
      if (ms.date !== today) this.ensureMissions();
      for (const m of ms.list) {
        if (m.done) continue;
        switch (m.id) {
          case 'ghosts': m.progress += s.ghosts; break;
          case 'fruits': m.progress += s.fruits; break;
          case 'levels': m.progress += this.levelsCleared; break;
          case 'score': m.progress = Math.max(m.progress, score); break;
          case 'powerups': m.progress += s.powerups; break;
          case 'battle': m.progress += win ? 1 : 0; break;
          case 'dots': m.progress += s.dots; break;
          case 'combo': m.progress = Math.max(m.progress, me.bestCombo); break;
        }
        if (m.progress >= m.n) { m.done = true; coins += m.reward; finished.push(m); }
      }
      // achievements
      const got = [];
      const award = (id, cond) => { if (cond && !p.ach[id]) { p.ach[id] = Date.now(); got.push(PM.ACHIEVEMENTS.find(a => a.id === id)); } };
      award('first', true);
      award('level5', !g.battle && g.level >= 5);
      award('level10', !g.battle && g.level >= 10);
      award('ghost4', s.ghost4 > 0);
      award('ghosts100', st.ghosts >= 100);
      award('fruit10', st.fruits >= 10);
      award('score50k', !g.battle && score >= 50000);
      award('score100k', !g.battle && score >= 100000);
      award('perfect', this.perfectLevels > 0);
      award('battle_win', win);
      award('battle_hard', win && g.pacs.length === 4 && p.botSkill === 'hard');
      award('combo50', me.bestCombo >= 50);
      award('power20', st.powerups >= 20);
      award('shock3', this.shock3);
      award('insane', this.insaneClear);
      award('daily3', p.daily.streak >= 3);
      const lvlBefore = PM.levelOf(p.xp);
      p.xp += xp; p.coins += coins;
      this.save();
      this.renderProfile();
      const lvl = PM.levelOf(p.xp), a = PM.xpFor(lvl), b = PM.xpFor(lvl + 1);
      if (win || best) PM.Audio.sfx('extraLife');

      const title = g.battle ? (win ? 'VICTORY!' : ['', '1ST', '2ND', '3RD', '4TH'][place] + ' PLACE')
        : g.mode === 'daily' ? 'DAILY RUN OVER' : 'GAME OVER';
      const sub = [PM.MODES[g.mode].name + (g.mode === 'x27' ? ' · ' + PM.DIFFICULTY[g.diffId].name : '') + (g.battle ? ' · ' + PM.BOT_SKILL[p.botSkill].name + ' AI' : ' · Level ' + g.level)];
      if (best) sub.push('🎉 New personal best!');
      if (tablePos && tablePos <= 10) sub.push('#' + tablePos + ' on the high score table');
      if (this.practice) sub.push('Practice run (today\'s Daily already counted)');
      const kpis = g.battle
        ? [[fmt(s.dots), 'Dots'], [s.ghosts, 'Ghosts'], [s.rivals, 'Rivals eaten'], [s.deaths, 'Times caught']]
        : [[g.level, 'Level'], [fmt(s.dots), 'Dots'], [s.ghosts, 'Ghosts'], [g.features ? me.bestCombo : s.fruits, g.features ? 'Best combo' : 'Fruits']];
      const table = g.battle ? `<table class="table"><tr><th>#</th><th>PLAYER</th><th class="num">SCORE</th></tr>${rank.map((q, i) =>
        `<tr class="${q.isPlayer ? 'me' : ''}"><td>${i + 1}</td><td><span class="swatch" style="background:${PM.Draw.pacColor(q.color, 0)}"></span>${q.isPlayer ? esc(p.name || 'YOU') : esc(q.name) + ' <small style="opacity:.6">' + PM.PERSONALITIES[q.persId].name + '</small>'}</td><td class="num">${fmt(q.score)}</td></tr>`).join('')}</table>` : '';
      const rewards = [`<span>+${xp} XP</span>`, `<span class="gold">+${coins} 🪙</span>`]
        .concat(finished.map(m => `<span class="green">✓ ${esc(this.missionText(m))} +${m.reward}🪙</span>`))
        .concat(got.map(x => `<span class="gold">${x.icon} ${esc(x.name)}</span>`));
      this.showModal(`
        <p class="res-title">${title}</p>
        <div class="big-score">${fmt(score)}</div>
        <p class="res-sub">${sub.map(esc).join(' · ')}</p>
        ${table}
        <div class="kpis">${kpis.map(k => `<div class="kpi"><b>${k[0]}</b><span>${k[1]}</span></div>`).join('')}</div>
        <div class="rewards">${rewards.join('')}</div>
        <div class="lvl"><span>Lv ${lvl}</span><span class="xpbar"><i style="width:${Math.round((p.xp - a) / (b - a) * 100)}%"></i></span><span>${lvl > lvlBefore ? '⬆ LEVEL UP!' : PM.titleOf(lvl)}</span></div>
        <div class="row-btns">
          ${g.mode === 'daily' ? '<button class="btn cyan" id="r-share">📋 Share</button>' : ''}
          <button class="btn play" id="r-again">PLAY AGAIN</button>
          <button class="btn" id="r-menu">Menu</button>
        </div>`, () => this.toMenu());
      $('r-again').onclick = () => { this.closeModal(true); this.start(g.mode); };
      $('r-menu').onclick = () => this.closeModal();
      if ($('r-share')) $('r-share').onclick = () => this.share(score, g);
      setTimeout(() => $('r-again') && $('r-again').focus(), 60);
      for (const x of got) this.toast(x.icon + ' Achievement: ' + x.name, 'gold');
    },
    share(score, g) {
      const s = g.player.stats;
      const text = `PAC-MAN 2027* Daily Run ${PM.dateKey()}\n🟡 ${fmt(score)} pts · Level ${g.level}\n👻 ${s.ghosts} ghosts · 🍒 ${s.fruits} fruits · ⚡ ${s.powerups} power-ups` +
        (/^https?:/.test(location.href) ? '\n' + location.href.split('#')[0] : '');
      const done = () => this.toast('📋 Copied! Paste it anywhere.');
      const fallback = () => {
        const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select();
        try { document.execCommand('copy'); done(); } catch (e) { this.toast('Could not copy'); }
        t.remove();
      };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback); else fallback();
    },

    /* ---------------- modals ---------------- */
    showModal(html, onClose) {
      $('modal-body').innerHTML = html;
      $('modal').classList.remove('hidden');
      $('modal').querySelector('.sheet').scrollTop = 0;

    },

    },

      } else if (which === 'settings') {

          <div class="set">Sound effects${sw('s-sound', s.sound)}</div>

          <div class="set">Show ghost targets (training)${sw('s-targets', s.targets)}</div>
          <div class="set">Screen shake & particles${sw('s-motion', s.motion)}</div>
          <div class="set">Progress<button class="btn small ghost" id="s-reset">Reset everything</button></div>`);
        $('s-name').addEventListener('input', e => { p.name = e.target.value.toUpperCase().replace(/[^A-Z0-9 _-]/g, '').slice(0, 10); this.save(); this.renderProfile(); });
        const tog = (id, key) => { $(id).onclick = () => { s[key] = !s[key]; $(id).classList.toggle('on', s[key]); this.save(); this.applySettings(); }; };
        tog('s-sound', 'sound'); tog('s-music', 'music'); tog('s-targets', 'targets'); tog('s-motion', 'motion');
        $('s-vol').oninput = e => { s.volume = Number(e.target.value); PM.Audio.setVolume(s.volume); this.save(); };
        $('s-ctrl').onclick = e => { const b = e.target.closest('button'); if (!b) return; s.controls = b.dataset.v; $('s-ctrl').querySelectorAll('button').forEach(x => x.classList.toggle('sel', x === b)); this.save(); this.layout(); };
        let armed = false;
        $('s-reset').onclick = e => {
          if (!armed) { armed = true; e.target.textContent = 'Tap again to confirm'; return; }
          this.p = PM.Store.reset(); this.ensureMissions(); this.save(); this.applySettings(); this.renderMenu(); this.renderProfile(); this.closeModal(true); this.toast('Progress reset');
        };
      } else if (which === 'scores') {
        this.scoresTab = this.scoresTab || p.mode;
        const render = () => {
          const mode = this.scoresTab;
          const rows = p.scores[mode].map(x => ({ name: x.name, score: x.score, level: x.level, me: true }))
            .concat(PM.CPU_SCORES[mode].map(([n, sc]) => ({ name: n, score: sc, cpu: true })))
            .sort((a, b) => b.score - a.score).slice(0, 10);
          $('sc-body').innerHTML = `<table class="table"><tr><th>#</th><th>NAME</th><th class="num">LEVEL</th><th class="num">SCORE</th></tr>${rows.map((r, i) =>

        };

      } else if (which === 'profile') {
        const s = p.stats, lvl = PM.levelOf(p.xp);

              .map(k => `<div class="kpi"><b>${k[0]}</b><span>${k[1]}</span></div>`).join('')}

          <div class="row-btns"><button class="btn" data-open2="settings">Change name</button></div>`);
        $('modal-body').querySelector('[data-open2]').onclick = () => this.open('settings');
      } else if (which === 'garage') this.openGarage();
    },

    /* ---------------- garage & shop ---------------- */
    unlockState(cat, item) {
      const p = this.p;
      if (p.owned[cat].includes(item.id)) return { owned: true };
      if (!item.unlock) return { owned: true };
      if (item.unlock.coins) return { price: item.unlock.coins };
      const a = PM.ACHIEVEMENTS.find(x => x.id === item.unlock.ach);
      if (p.ach[item.unlock.ach]) { p.owned[cat].push(item.id); return { owned: true }; }
      return { ach: a };
    },
    openGarage() {
      this.garageTab = this.garageTab || 'color';
      this.showModal(`<h2>Garage</h2>
        <div class="garage-top"><canvas id="g-prev" width="120" height="120"></canvas>
          <div><p style="margin:0">Spend coins from games and missions. Some items unlock with achievements.</p><p class="coins" style="display:inline-block;margin:8px 0 0" id="g-coins"></p></div></div>
        <div class="tabs" id="g-tabs">${PM.GARAGE_TABS.map(([k, l]) => `<button data-t="${k}">${l}</button>`).join('')}</div>
        <div class="items" id="g-items"></div>`);
      $('g-tabs').onclick = e => { const b = e.target.closest('button'); if (b) { this.garageTab = b.dataset.t; this.renderGarage(); } };
      $('g-items').onclick = e => { const b = e.target.closest('.item'); if (b) this.garageClick(b); };
      this.renderGarage();
      this.garageTimer = setInterval(() => { if ($('g-prev')) this.drawPacPreview($('g-prev'), 120, this.equipColor(), this.p.equip.hat, this.p.equip.trail); }, 100);
    },
    renderGarage() {
      const p = this.p, cat = this.garageTab;
      $('g-tabs').querySelectorAll('button').forEach(b => b.classList.toggle('sel', b.dataset.t === cat));
      $('g-coins').textContent = '🪙 ' + fmt(p.coins);
      $('g-items').innerHTML = PM.CATALOG[cat].map(it => {
        const st = this.unlockState(cat, it), eq = p.equip[cat] === it.id;
        const tag = st.owned ? (eq ? 'Equipped' : 'Owned') : st.price ? `<small class="price">🪙 ${fmt(st.price)}</small>` : `<small>🏆 ${esc(st.ach.name)}</small>`;
        return `<button class="item${eq ? ' eq' : ''}${st.owned ? '' : ' locked'}" data-id="${it.id}"><canvas data-c="${cat}" data-i="${it.id}"></canvas>${esc(it.name)}${st.owned ? `<small>${tag}</small>` : tag}</button>`;
      }).join('');
      $('g-items').querySelectorAll('canvas').forEach(c => {
        const i = c.dataset.i;
        if (cat === 'color') this.drawPacPreview(c, 54, this.equipColor(i), 'none');
        else if (cat === 'hat') this.drawPacPreview(c, 54, this.equipColor(), i);
        else if (cat === 'trail') this.drawPacPreview(c, 54, this.equipColor(), 'none', i);
        else this.drawPacPreview(c, 54, null, null, null, i);
      });
      this.drawPacPreview($('g-prev'), 120, this.equipColor(), p.equip.hat, p.equip.trail);
      this.renderProfile();
    },
    garageClick(btn) {
      const p = this.p, cat = this.garageTab, it = PM.CATALOG[cat].find(x => x.id === btn.dataset.id);
      const st = this.unlockState(cat, it);
      if (st.owned) { p.equip[cat] = it.id; PM.Audio.sfx('click'); }
      else if (st.price) {
        if (p.coins < st.price) { this.nope(btn, 'Need ' + fmt(st.price - p.coins) + ' more coins'); return; }
        p.coins -= st.price; p.owned[cat].push(it.id); p.equip[cat] = it.id;
        PM.Audio.sfx('coin'); this.toast('Unlocked ' + it.name + '!', 'gold');
      } else { this.nope(btn, 'Unlock: ' + st.ach.desc); return; }
      this.save(); this.renderGarage(); this.renderMenu();
    },
    nope(btn, msg) { btn.classList.remove('shake'); void btn.offsetWidth; btn.classList.add('shake'); PM.Audio.sfx('hurt'); this.toast(msg); }
  };

  PM.App = App;
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => App.boot());
  else App.boot();
})(window.PM = window.PM || {});
</script>
</body>
</html>
